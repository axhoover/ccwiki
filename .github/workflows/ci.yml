# Compile and run the unit tests on every push and pull request.
#
# This is `make check` on a macOS runner: the same gate a contributor runs
# locally. It does not run `make shots` (no display, no Screen Recording
# grant) and it does not run `make test-corpus` (no clone), so a green run is
# "compiles and the unit tests pass", nothing more. See
# plans/build-system.md, "CI gate".
#
# It also checks both build identities (plans/build-system.md, "Two
# channels"): what the release channel stamps, without building it, and that
# the app it does build is CCwiki Dev.
#
# Cost: this is a private repository, and a macOS runner minute counts ten
# times against the account's free Actions quota. Every push gets the
# compile-and-test half (~40 s); assembling and uploading the app, and the
# timings measured alone (2–3 minutes), are kept for pull requests, main,
# and manual runs.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Vendored render pipeline is intact
        run: ./scripts/vendor-web.sh --check

      # What `make package` will stamp, without building it: the release
      # channel is com.axhoover.ccwiki with the version as given and the
      # ccwiki:// scheme, and it refuses a version that is not X.Y.Z.
      - name: Release channel identity
        run: |
          plist="$RUNNER_TEMP/release-Info.plist"
          ./scripts/stamp-info-plist.sh release 1.2.3 202610111530 Resources/Info.plist "$plist"
          plutil -lint "$plist"
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          fail() { echo "::error::$*"; exit 1; }
          [ "$(read_key CFBundleIdentifier)" = com.axhoover.ccwiki ] || fail "release bundle id is $(read_key CFBundleIdentifier)"
          [ "$(read_key CFBundleName)" = CCwiki ] || fail "release name is $(read_key CFBundleName)"
          [ "$(read_key CFBundleShortVersionString)" = 1.2.3 ] || fail "release version is $(read_key CFBundleShortVersionString)"
          [ "$(read_key CFBundleVersion)" = 202610111530 ] || fail "release build is $(read_key CFBundleVersion)"
          [ "$(read_key CFBundleURLTypes:0:CFBundleURLSchemes:0)" = ccwiki ] || fail "release scheme is $(read_key CFBundleURLTypes:0:CFBundleURLSchemes:0)"
          for version in 0.1.3-dev 0.0.0; do
            if ./scripts/stamp-info-plist.sh release "$version" 1 Resources/Info.plist "$RUNNER_TEMP/refused.plist"; then
              fail "the release channel stamped $version"
            fi
          done
          echo "✓ release channel: com.axhoover.ccwiki 1.2.3, ccwiki://, refuses 0.1.3-dev and 0.0.0"

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: make check
        run: make check

      # The whole-corpus suites, and search relevance, against the wiki as
      # it is today. The wiki is public, so this is one shallow clone.
      - name: Clone the wiki
        run: git clone --depth 1 https://github.com/axhoover/cryptology.city "$RUNNER_TEMP/wiki"

      - name: Corpus and search relevance
        run: make test-corpus WIKI="$RUNNER_TEMP/wiki" 2>&1 | tee "$RUNNER_TEMP/corpus.log"; exit ${PIPESTATUS[0]}

      # The load and render timings again, with no other suite beside them:
      # the numbers plans/efficiency.md compares (§2.3). Inside
      # `make test-corpus` every suite runs at once, and a phase whose code
      # did not change moved by up to 41% between runs. Kept for pull
      # requests, main and manual runs, as `make release` is: a macOS minute
      # counts ten times against the quota. It runs after a failed step too,
      # whose timings are still worth reading, but not in a cancelled run.
      # Without a clone (the clone step failed, or never ran) it has nothing
      # to time.
      - name: Load and render timings, measured alone
        if: ${{ !cancelled() && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
        env:
          CCWIKI_WIKI: ${{ runner.temp }}/wiki
          CCWIKI_TIMINGS_ALONE: "1"
        run: |
          [ -d "$CCWIKI_WIKI/content" ] || exit 0
          git -C "$CCWIKI_WIKI" log -1 --format='wiki %h %cs'
          swift test --no-parallel --filter 'IncrementalCorpusTests|RenderCorpusTests'

      - name: Relevance report
        if: always()
        run: |
          # Each report is a "<name>: N queries" line and its indented lines.
          [ -f "$RUNNER_TEMP/corpus.log" ] || exit 0
          awk '/: [0-9]+ queries$/ { on = 1; print; next }
               /^ / { if (on) print; next }
               { on = 0 }' "$RUNNER_TEMP/corpus.log" | head -150 || true

      # The other half of build.sh: the icon, the bundle, the universal
      # binary, ad-hoc signing. Uploaded so a build of any commit can be
      # tried without a toolchain. It is NOT a release: ad-hoc signed, so
      # Gatekeeper refuses it on any Mac but one that strips the quarantine
      # attribute — see plans/distribution.md for the real thing.
      - name: make release
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: make release

      # A build from source is CCwiki Dev, never something that could pass
      # for the release: its own id, a -dev version, its own URL scheme.
      - name: The build is CCwiki Dev
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: |
          plist="build/CCwiki Dev.app/Contents/Info.plist"
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          fail() { echo "::error::$*"; exit 1; }
          id="$(read_key CFBundleIdentifier)"
          version="$(read_key CFBundleShortVersionString)"
          scheme="$(read_key CFBundleURLTypes:0:CFBundleURLSchemes:0)"
          [ "$id" = com.axhoover.ccwiki.dev ] || fail "the build's bundle id is $id"
          [ "$(read_key CFBundleName)" = "CCwiki Dev" ] || fail "the build's name is $(read_key CFBundleName)"
          case "$version" in *-dev*) ;; *) fail "the build's version $version has no -dev" ;; esac
          [ "$scheme" = ccwiki-dev ] || fail "the build's URL scheme is $scheme"
          echo "✓ $id $version, $scheme://"

      # build.sh names a dev build "CCwiki Dev.app", and the zip keeps the
      # name: one that unzipped as CCwiki.app could be dragged over the
      # release in /Applications.
      - name: Package the app
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "build/CCwiki Dev.app" dist/CCwiki-dev.zip
          shasum -a 256 dist/CCwiki-dev.zip

      # One day: this is a build to try today, not to keep, and artifact
      # storage counts against the account's Actions quota.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        with:
          name: CCwiki-dev-${{ github.sha }}
          path: dist/CCwiki-dev.zip
          retention-days: 1
